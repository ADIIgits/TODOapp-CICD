---
- name: Install Apache2, Nagios, Nagios plugins, and Apache utilities
  ansible.builtin.apt:
    name:
      - apache2
      - apache2-utils
      - nagios4
      - nagios-plugins-basic
      - nagios-plugins-standard
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Ensure Apache2 listens on port 8080 (leaving port 80 for Nginx)
  ansible.builtin.copy:
    dest: /etc/apache2/ports.conf
    content: |
      Listen 8080
      <IfModule ssl_module>
              Listen 8443
      </IfModule>
      <IfModule mod_gnutls.c>
              Listen 8443
      </IfModule>
    mode: '0644'

- name: Update Apache default VirtualHost to port 8080
  ansible.builtin.replace:
    path: /etc/apache2/sites-available/000-default.conf
    regexp: '<VirtualHost \*:80>'
    replace: '<VirtualHost *:8080>'

- name: Restart Apache2 immediately so port 80 is released for Nginx
  ansible.builtin.service:
    name: apache2
    state: restarted

- name: Enable Apache CGI and Rewrite modules for Nagios
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - cgi
    - rewrite

- name: Enable Nagios4 Apache site configuration
  ansible.builtin.command: a2enconf nagios4-cgi
  args:
    creates: /etc/apache2/conf-enabled/nagios4-cgi.conf

- name: Create Nagios admin web credentials
  ansible.builtin.shell: |
    htpasswd -b -c /etc/nagios4/htpasswd.users {{ nagios_admin_user }} '{{ nagios_admin_password }}'
  args:
    creates: /etc/nagios4/htpasswd.users

- name: Ensure correct permissions on htpasswd.users
  ansible.builtin.file:
    path: /etc/nagios4/htpasswd.users
    owner: root
    group: www-data
    mode: '0640'

- name: Fix Nagios4 CGI Apache config permissions (Allow all authenticated users)
  ansible.builtin.copy:
    dest: /etc/apache2/conf-available/nagios4-cgi.conf
    content: |
      ScriptAlias /nagios4/cgi-bin /usr/lib/cgi-bin/nagios4
      Alias /nagios4 /usr/share/nagios4/htdocs

      <DirectoryMatch "^(?:/usr/share/nagios4/htdocs|/usr/lib/cgi-bin/nagios4)">
          Options FollowSymLinks
          DirectoryIndex index.php index.html
          AllowOverride AuthConfig
          AuthType Basic
          AuthName "Nagios4 Access"
          AuthUserFile /etc/nagios4/htpasswd.users
          Require valid-user
      </DirectoryMatch>

      <Directory /usr/share/nagios4/htdocs>
          Options Indexes FollowSymLinks
          AllowOverride None
          Require valid-user
      </Directory>
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache2

- name: Ensure Apache serves / with a redirect to /nagios4/
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: '<meta http-equiv="refresh" content="0; url=/nagios4/">'
    owner: www-data
    group: www-data
    mode: '0644'

- name: Deploy custom Nagios service check configuration for Todo App
  ansible.builtin.template:
    src: todo_services.cfg.j2
    dest: /etc/nagios4/conf.d/todo_services.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nagios4

- name: Fix Nagios cgi.cfg permissions to authorize nagiosadmin
  ansible.builtin.replace:
    path: /etc/nagios4/cgi.cfg
    regexp: '^(authorized_for_[a-z_]+)=.*$'
    replace: '\1=nagiosadmin,*'

- name: Add www-data user to nagios group so CGIs can read status.dat
  ansible.builtin.user:
    name: www-data
    groups: nagios
    append: true

- name: Ensure correct group permissions on Nagios var directory
  ansible.builtin.file:
    path: /var/lib/nagios4
    state: directory
    mode: '0750'
    owner: nagios
    group: nagios

- name: Ensure Nagios4 service is restarted and enabled
  ansible.builtin.service:
    name: nagios4
    state: restarted
    enabled: true

- name: Ensure Apache2 service is restarted and enabled
  ansible.builtin.service:
    name: apache2
    state: restarted
    enabled: true
