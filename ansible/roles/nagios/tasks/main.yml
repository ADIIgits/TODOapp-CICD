---
- name: Install Apache2, Nagios, Nagios plugins, and Apache utilities
  ansible.builtin.apt:
    name:
      - apache2
      - apache2-utils
      - nagios4
      - nagios-plugins-basic
      - nagios-plugins-standard
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Ensure Apache2 listens on port 8080 (leaving port 80 for Nginx)
  ansible.builtin.copy:
    dest: /etc/apache2/ports.conf
    content: |
      Listen 8080
      <IfModule ssl_module>
              Listen 8443
      </IfModule>
      <IfModule mod_gnutls.c>
              Listen 8443
      </IfModule>
    mode: '0644'

- name: Update Apache default VirtualHost to port 8080
  ansible.builtin.replace:
    path: /etc/apache2/sites-available/000-default.conf
    regexp: '<VirtualHost \*:80>'
    replace: '<VirtualHost *:8080>'

- name: Restart Apache2 immediately so port 80 is released for Nginx
  ansible.builtin.service:
    name: apache2
    state: restarted

- name: Enable Apache CGI and Rewrite modules for Nagios
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - cgi
    - rewrite
  notify: Restart Apache2

- name: Create Nagios admin web credentials
  ansible.builtin.shell: |
    htpasswd -b -c /etc/nagios4/htpasswd.users {{ nagios_admin_user }} '{{ nagios_admin_password }}'
  args:
    creates: /etc/nagios4/htpasswd.users

- name: Ensure correct permissions on htpasswd.users
  ansible.builtin.file:
    path: /etc/nagios4/htpasswd.users
    owner: root
    group: www-data
    mode: '0640'

- name: Deploy custom Nagios service check configuration for Todo App
  ansible.builtin.template:
    src: todo_services.cfg.j2
    dest: /etc/nagios4/conf.d/todo_services.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nagios4

- name: Ensure Apache2 service is started and enabled
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Ensure Nagios4 service is started and enabled
  ansible.builtin.service:
    name: nagios4
    state: started
    enabled: true
